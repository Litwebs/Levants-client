server {
    listen 80;
    server_name uat.levantsdairy.co.uk;
    location /.well-known/acme-challenge/ { root /var/lib/levants-uat-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name uat.levantsdairy.co.uk;
    ssl_certificate /etc/letsencrypt/live/uat.levantsdairy.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.levantsdairy.co.uk/privkey.pem;
    root /srv/levants-uat-storefront/current;
    index index.html;
    # Temporarily disabled; restore the realm below to require a password.
    auth_basic off;
    # auth_basic "Levants UAT";
    auth_basic_user_file /etc/levants-uat/storefront.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Levants-Environment "uat" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.stripe.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://uat-api.levantsdairy.co.uk https://api.stripe.com https://*.stripe.com https://*.stripe.network; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
    location ~ \.html$ { expires -1; }
    location = /release.json { auth_basic off; expires -1; }
    location ~ /\. { deny all; }
}
