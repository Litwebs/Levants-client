name: Stage verified WhatsApp storefront build
on:
  push:
    branches: [ops/whatsapp-release-20261120]
    paths: [.github/workflows/stage-whatsapp-release.yml]
permissions:
  contents: write
  pages: read
concurrency:
  group: approved-production-storefront
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: e67ac75387b9329d48108def258d7e8dd236380a
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/subscriptionSessionRetry.test.mjs
      - name: Build production assets
        env:
          VITE_API_BASE_URL: https://api.levantsdairy.co.uk/api
        run: |
          npm run build
          touch dist/.nojekyll
          node -e 'const fs=require("node:fs"), p="dist/assets/"; const sources=fs.readdirSync(p).filter(n=>n.endsWith(".js")).map(n=>fs.readFileSync(p+n,"utf8")); if(!sources.some(x=>x.includes("https://wa.me/")&&x.includes("447494927688")&&x.includes("WhatsApp")))process.exit(1)'
      - name: Validate production environment and Pages source
        env:
          RELEASE_SHA: e67ac75387b9329d48108def258d7e8dd236380a
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-production.mjs
      - name: Stage exact hotfix assets for publishing
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          test "$(git rev-parse origin/gh-pages)" = '640273725ed7eb57df63d99a2ae159bc7e341e6d'
          BUILD_DIR="$RUNNER_TEMP/production-pages"
          git worktree add --detach "$BUILD_DIR" origin/gh-pages
          git -C "$BUILD_DIR" switch -c "release/whatsapp-build-e67ac75387b9329d48108def258d7e8dd236380a"
          rsync -a --delete --exclude=.git dist/ "$BUILD_DIR/"
          git -C "$BUILD_DIR" add --all
          git -C "$BUILD_DIR" add -f release.json
          git -C "$BUILD_DIR" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "WhatsApp storefront release e67ac75387b9329d48108def258d7e8dd236380a"
          git -C "$BUILD_DIR" push origin "HEAD:refs/heads/release/whatsapp-build-e67ac75387b9329d48108def258d7e8dd236380a"
