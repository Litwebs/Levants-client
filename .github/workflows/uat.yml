name: Build and deploy UAT storefront
on:
  push:
    branches: [uat]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: levants-uat-storefront
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check subscription discount feedback and renewal wording
        if: contains(github.event.head_commit.message, '[subscription-code-ui]')
        run: npm run typecheck && npx vitest run tests/subscription-discount-feedback.test.tsx tests/subscription-intro-offer.test.tsx tests/subscription-stock-availability.test.tsx
      - run: npm run test:uat
      - name: Issue 67 focused payment-copy regressions
        run: node --test tests/issue67PaymentCopy.test.mjs
      - name: Build and verify isolated storefront
        env:
          VITE_API_BASE_URL: https://uat-api.levantsdairy.co.uk/api
        run: npm run build:uat
      - run: python3 deployment/uat/package.py /tmp/storefront.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-${{ github.sha }}
          path: /tmp/storefront.tar.gz
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storefront-${{ github.sha }}
          path: release
      - name: Configure dedicated storefront deployment key
        env:
          DEPLOY_KEY: ${{ secrets.UAT_STOREFRONT_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.UAT_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/uat
          chmod 600 ~/.ssh/uat
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy storefront only
        env:
          UAT_HOST: ${{ vars.UAT_HOST }}
          UAT_PORT: ${{ vars.UAT_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test -n "$UAT_HOST"
          test -n "$UAT_PORT"
          ssh -i ~/.ssh/uat -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$UAT_PORT" "levants-uat-storefront-deploy@$UAT_HOST" \
            "deploy $RELEASE_SHA" < release/storefront.tar.gz
          curl --fail --retry 3 https://uat.levantsdairy.co.uk/release.json > /tmp/deployed.json
          python3 -c 'import json,os; assert json.load(open("/tmp/deployed.json"))["sha"] == os.environ["RELEASE_SHA"]'
  basket-persistence:
    name: Deployed basket and subscription review acceptance
    needs: deploy
    runs-on: ubuntu-latest
    # Match the exact Playwright version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify the deployed release before testing
        env:
          EXPECTED_UAT_SHA: ${{ github.sha }}
        run: |
          curl --fail --retry 3 https://uat.levantsdairy.co.uk/release.json > /tmp/basket-release.json
          node -e 'const fs=require("fs"); if(JSON.parse(fs.readFileSync("/tmp/basket-release.json","utf8")).sha !== process.env.EXPECTED_UAT_SHA) process.exit(1)'
      - name: Verify deployed baskets and subscription review feedback
        run: npx playwright test --config playwright.uat-basket.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-uat-basket-persistence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
