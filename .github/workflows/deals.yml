name: Customer deals checks
on:
  pull_request:
    branches: [main, uat, feat/customer-deals]
  push:
    branches: [feat/customer-deals, feature/deals]
permissions:
  contents: read
jobs:
  storefront:
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'hotfix/visual-subscription-guide-20261101' && github.event.pull_request.base.sha == '640d442c82742fbfdd2bd5cbc3a0b5f5e6a4227b') }}
    name: Storefront deals, typecheck and build
    runs-on: ubuntu-latest
    # Match the exact Playwright version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:deals
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint deal implementation
        run: npx eslint src/api/deals.ts src/components/deals src/context/CartContext.tsx src/pages/DealsPage.tsx src/pages/DealDetailPage.tsx src/pages/HomePage.tsx src/components/layout/Header.tsx tests/deals.test.tsx tests/deals-presentation.test.tsx tests/addresses.test.tsx src/portal/tours tests/portal-tour-interactions.test.tsx tests/portal-tours.test.tsx tests/browser playwright.config.ts vitest.config.ts
      - run: npm run build
      - run: npm run test:deals:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
