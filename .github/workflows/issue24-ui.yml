name: Issue 24 catalog and ordering acceptance
on:
  push:
    branches: [feat/24-shared-catalog-controls]
permissions:
  contents: read
concurrency:
  group: issue24-catalog-acceptance
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Component and metadata regressions, types, lint and build
        if: ${{ !contains(github.event.head_commit.message, '[browser-only]') }}
        run: npm run test:deals && npm run typecheck && npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Catalog layout, quantity, carousel, basket and checkout regressions
        run: npx playwright test tests/browser/deals.spec.ts tests/browser/deals-feature.spec.ts tests/browser/promotions.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue24-browser-evidence
          path: |
            test-results/
            playwright-report/
