name: One-off client gh-pages deploy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'feature/one-time-order-checkout-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/one-time-order-checkout-fix
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure deploy commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        run: npm run deploy
