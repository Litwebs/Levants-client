name: Basket persistence acceptance
on:
  pull_request:
    branches: [uat]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.uat-basket.config.ts'
      - '.github/workflows/basket-persistence.yml'
permissions:
  contents: read
concurrency:
  group: basket-persistence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployed-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint tests/uat/basket-persistence.spec.ts playwright.uat-basket.config.ts
      - run: npx playwright install --with-deps chromium webkit
      - name: Test real UAT basket storage in Chromium and WebKit
        run: npx playwright test --config playwright.uat-basket.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-uat-basket-persistence
          path: |
            playwright-report/
            test-results/
