name: Promotional campaign storefront checks
on:
  pull_request:
    branches: [uat]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/promotions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promotions-storefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:deals && npm run test:subscription-retries && npm run test:uat
      - run: npx eslint src/api/promotions.ts src/hooks/usePromotionPricing.ts src/components/cart/PromotionSummary.tsx src/pages/CartPage.tsx src/pages/CheckoutPage.tsx src/context/CartContext.tsx src/components/cart/CartDrawer.tsx src/components/layout/Header.tsx tests/promotions.test.tsx tests/browser/promotions.spec.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotions-storefront-browser-evidence
          path: |
            playwright-report/
            test-results/
