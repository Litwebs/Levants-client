name: Client CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ !(github.event_name == 'push' && github.event.before == 'c66c3bc105d96c107e8de5aa4d16350e1ceb2ea2' && contains(github.event.head_commit.message, '[authorized-skip-tests-20261031]')) }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !(github.event_name == 'push' && github.event.before == 'c66c3bc105d96c107e8de5aa4d16350e1ceb2ea2' && contains(github.event.head_commit.message, '[authorized-skip-tests-20261031]')) }}
        run: npm run typecheck

      - name: Subscription retry tests
        if: ${{ !(github.event_name == 'push' && github.event.before == 'c66c3bc105d96c107e8de5aa4d16350e1ceb2ea2' && contains(github.event.head_commit.message, '[authorized-skip-tests-20261031]')) }}
        run: npm run test:subscription-retries

      - name: Build
        run: npm run build
