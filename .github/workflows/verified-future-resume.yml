name: Build production hotfix
on:
  push:
    branches: [ops/stage-future-resume-20261125]
permissions:
  contents: write
  pages: read
concurrency:
  group: approved-production-storefront
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d8e833919291ef5d25fe59d431a645d4425e12ee
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/subscriptionSessionRetry.test.mjs
      - name: Build production assets
        env:
          VITE_API_BASE_URL: https://api.levantsdairy.co.uk/api
        run: |
          npm run build
          touch dist/.nojekyll
      - name: Validate production environment and Pages source
        env:
          RELEASE_SHA: d8e833919291ef5d25fe59d431a645d4425e12ee
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-production.mjs
      - name: Stage exact hotfix assets for publishing
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          BUILD_DIR="$RUNNER_TEMP/production-pages"
          git worktree add --detach "$BUILD_DIR" origin/gh-pages
          git -C "$BUILD_DIR" switch -c "release/verified-future-resume-d8e833919291ef5d25fe59d431a645d4425e12ee"
          rsync -ac --delete --exclude=.git dist/ "$BUILD_DIR/"
          test -z "$(diff -qr --exclude=.git dist/ "$BUILD_DIR/")"
          git -C "$BUILD_DIR" add --all
          git -C "$BUILD_DIR" add -f release.json
          git -C "$BUILD_DIR" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Production hotfix ${{ github.sha }}"
          git -C "$BUILD_DIR" push origin "HEAD:refs/heads/release/verified-future-resume-d8e833919291ef5d25fe59d431a645d4425e12ee"
